<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><meta
    name="theme-color"
    content="#101827"
  /><title>Atmos · Offline</title
  ><style>
    body {
      margin: 0;
      padding: 40px;
      background: #101827;
      color: #edf2f9;
      font: 16px/1.6 system-ui;
      min-height: 80vh;
      display: grid;
      place-content: center;
    }
    main {
      max-width: 420px;
    }
    h1 {
      font-size: 35px;
    }
    p {
      color: #9cacc2;
    }
    a {
      display: inline-block;
      padding: 10px 17px;
      background: #efba7a;
      color: #101827;

      text-decoration: none;
    }
  </style>
  <main>
    <h1>A pause in the signal.</h1>
    <p>
      You’re offline. Reopen your last forecast to view saved weather, or reconnect to download a

    </p>
    <a href="/weather">Open saved forecast</a>

</html>
